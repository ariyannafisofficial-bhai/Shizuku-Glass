name: Build APK (Liquid Glass)

# One click: Actions tab -> "Build APK (Liquid Glass)" -> Run workflow.
# The APK is attached to the run as an artifact (and to a Release, if you tick the box).
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish the APK as a GitHub Release'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The runner has no debug keystore, and the build signs the release APK with it unless
      # signing.properties exists. A key from the DEBUG_KEYSTORE_B64 secret is used if you set
      # one (so every build has the same signature and updates install over each other);
      # otherwise a fresh key is made for this run.
      - name: Prepare signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          for D in "$HOME/.android" "$HOME/.config/.android"; do
            mkdir -p "$D"
            if [ -n "$DEBUG_KEYSTORE_B64" ]; then
              echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$D/debug.keystore"
            else
              rm -f "$D/debug.keystore"
              keytool -genkeypair -keystore "$D/debug.keystore" -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          done

      - name: Build release APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ./gradlew :manager:assembleRelease

      - name: Collect APK
        id: apk
        run: |
          FILE=$(ls manager/build/outputs/apk/release/*.apk | head -n1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FILE")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="glass-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" \
            --title "Shizuku Next (Liquid Glass) $TAG" \
            --notes "Custom build: Liquid Glass theme (Settings -> Liquid Glass) and custom launcher icon."
