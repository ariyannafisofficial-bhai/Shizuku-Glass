name: Build APK (Liquid Glass)

# One click: Actions tab -> "Build APK (Liquid Glass)" -> Run workflow.
# The APK is attached to the run as an artifact (and to a Release, if you tick the box).
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish the APK as a GitHub Release'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ./gradlew :manager:assembleRelease

      - name: Collect APK
        id: apk
        run: |
          FILE=$(ls manager/build/outputs/apk/release/*.apk | head -n1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FILE")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="glass-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" \
            --title "Shizuku Next (Liquid Glass) $TAG" \
            --notes "Custom build: Liquid Glass theme (Settings -> Liquid Glass) and custom launcher icon."
